<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/linker/"><title>Graph Linker · 赛制实验室</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon">↗</span><div>GRAPH LINKER<small>CSEM · 赛制实验室</small></div></div><div class="document"><input id="documentName" aria-label="赛制名称"><span>概念原型 / v0.1</span></div><div class="actions"><button id="importBtn">导入 .csem</button><button id="exportBtn">导出 .csem</button><button class="primary" id="validateBtn">校验流程</button><input id="fileInput" type="file" accept=".csem,application/json" hidden></div></header>
<div class="workspace">
<aside class="leftbar"><div class="section-head"><span>流程结构</span><span class="eyebrow">STRUCTURE</span></div><div class="left-inner"><div class="group-label">阶段 <button id="addStageBtn" title="添加阶段">＋</button></div><nav id="stages"></nav><div class="group-label">全局种子层 <span id="seedCount"></span></div><div id="seeds"></div><button id="addSeedBtn" class="full">＋ 添加队伍</button><div class="hint">种子属于整套赛事，可分配到不同阶段的起始层。模拟视图隐藏种子与起始层。</div><div class="divider"></div><div class="group-label">示例与草稿</div><button id="sampleBtn" class="full">载入 8 队两阶段示例</button><button id="emptyBtn" class="full">新建空白流程</button><p class="hint">修改结构会重置演算。草稿自动保存在此浏览器。</p></div><a class="doclink" href="CPP_MIGRATION.md" target="_blank">.csem 与 C++ 迁移说明 ↗</a></aside>
<main><div class="canvas-top"><div><span class="eyebrow">FLOW CANVAS</span><h1 id="stageHeading"></h1></div><div class="canvas-controls"><button id="addMatchBtn">＋ 比赛框</button><button id="addResultBtn">＋ 赛果位</button><button id="undoBtn" title="撤销结构修改">撤销</button><button id="viewBtn">模拟视图</button></div></div><div class="canvas-instructions"><span id="linkInstruction">点击出口，再点击入口连线。拖动比赛框标题调整位置。</span><div class="zoom-controls"><button id="zoomOutBtn" aria-label="缩小画布">−</button><span id="zoomValue">100%</span><button id="zoomInBtn" aria-label="放大画布">＋</button><button id="fitBtn">适应画布</button></div></div><div id="canvasScroll"><div id="canvas"><svg id="links" aria-label="连接通道"></svg><div id="nodes"></div></div></div><div class="runtime-bar"><div><span class="eyebrow">STEP SIMULATOR</span><b id="runtimeStatus">尚未开始</b></div><button id="resetBtn">重置演算</button><button id="backStepBtn">退回一步</button><button id="stepBtn" class="primary">下一步 · 结束一场</button></div></main>
<aside class="rightbar"><div class="section-head"><span>属性检查器</span><span class="eyebrow">INSPECTOR</span></div><div id="inspector"></div><div class="section-head validation-title"><span>流程校验</span><span id="issueCount"></span></div><div id="issues"></div><div class="section-head"><span>推进记录</span><span class="eyebrow">LIVE LOG</span></div><div id="log"></div></aside>
</div><div id="toast" role="status"></div><script src="engine.js"></script><script src="editor.js"></script><script src="graph_linker.js"></script>
</body></html>
